name: Reprocess product images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reprocess-product-images.yml"

permissions:
  contents: write

jobs:
  reprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Reprocess product images in full sRGB
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageCms
          import re

          assets = Path("assets")
          srgb = ImageCms.ImageCmsProfile(ImageCms.createProfile("sRGB")).tobytes()
          lut = [max(0, min(255, round(((i / 255.0) ** 0.94) * 255))) for i in range(256)]

          changed = 0
          for path in sorted(assets.glob("ECO-30-*.png")):
              im = Image.open(path)

              # The supplied renders are indexed PNGs with very small palettes.
              # Process only those originals, so the workflow is safe to run again.
              if im.mode != "P":
                  print("skip already reprocessed:", path)
                  continue

              rgba = im.convert("RGBA")
              r, g, b, a = rgba.split()
              rgb = Image.merge("RGB", (r.point(lut), g.point(lut), b.point(lut)))
              # Mild color restoration only; no contrast filter.
              rgb = ImageEnhance.Color(rgb).enhance(1.08)

              amin, amax = a.getextrema()
              if amin < 253:
                  out = Image.merge("RGBA", (*rgb.split(), a))
              else:
                  out = rgb

              out.save(
                  path,
                  "PNG",
                  icc_profile=srgb,
                  optimize=True,
                  compress_level=7,
              )
              changed += 1
              print("reprocessed:", path, im.mode, "->", out.mode)

          # Force browsers to request the new first image immediately on each product page.
          version = "20261012-color1"
          for path in sorted(Path(".").glob("eco-30-*.html")):
              text = path.read_text(encoding="utf-8")
              new = re.sub(
                  r'(src="assets/ECO-30-\d+\.png)(?:\?[^"]*)?(")',
                  rf'\1?v={version}\2',
                  text,
              )
              if new != text:
                  path.write_text(new, encoding="utf-8")
                  print("cache version:", path)

          print("processed images:", changed)
          PY

      - name: Commit reprocessed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ECO-30-*.png eco-30-*.html
          if git diff --cached --quiet; then
            echo "No image changes to commit"
          else
            git commit -m "Reprocess product images in full sRGB"
            git push origin main
          fi

      - name: Deploy processed site to hoster.by
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 87.232.64.108
          username: chatgpt
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
